name: Java Spring Boot Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: 2. Instalar Máquina Virtual Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: 3. Dar permisos de ejecución al Wrapper (Garantía Linux)
      run: chmod +x mvnw

    - name: 4. Descargar Librerías de Maven y Compilar Código Fuente
      run: ./mvnw clean compile

    - name: 5. Ejecutar Pruebas Unitarias Integradas
      run: ./mvnw test

    - name: 6. Empaquetar el archivo binario JAR de Producción
      run: ./mvnw package -DskipTests=true

    - name: 7. Construir Imagen Docker
      run: docker build -t robvaldes-tech/java-gateway:latest -f Dockerfile.java .
